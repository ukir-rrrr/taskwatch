<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --field:#F6F6F5;
  --rule:#E3E3E1;
  --rule-soft:#EEEEEC;
  --ink:#1A1A1A;
  --ink-2:#555553;
  --ink-3:#8E8E8B;
  --track:#E8E8E6;
  --fill:#3A3A38;
  --primary:#1E4F86;
  --primary-ink:#FFFFFF;
  --primary-hover:#173F6C;
  --primary-tint:#EEF3F9;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Sans JP",system-ui,sans-serif;
  font-size:13.5px;line-height:1.7;color:var(--ink);
  background:var(--paper);
  font-feature-settings:"palt" 1;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{
  display:grid;
  grid-template-columns:232px minmax(0,1fr) 384px;
  height:100vh;
}
.app.is-reports{grid-template-columns:232px minmax(0,1fr)}
.app.is-reports .panel{display:none}

/* ---------- sidebar ---------- */
.side{
  border-right:1px solid var(--rule);background:var(--field);
  display:flex;flex-direction:column;padding:20px 0 16px;overflow-y:auto;
}
.brand{padding:0 20px 22px;font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.brand-mark{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:50%;position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:50%;top:2px;width:1.5px;height:5px;background:var(--ink);transform:translateX(-50%)}

/* view switch: 2 large tabs with a primary underline, mirrors the phone tab bar */
.switch{display:flex;flex-direction:column;gap:2px;padding:0 10px;margin-bottom:26px}
.switch button{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:7px 10px;border-radius:4px;color:var(--ink-2);font-weight:500;font-size:14px;
}
.switch button:hover{background:#EDEDEB}
.switch svg{width:17px;height:17px;flex:none}
.switch button[aria-selected="true"]{color:var(--primary);background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule)}
.switch button[aria-selected="true"]::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:2px;background:var(--primary)}
.switch .cnt{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:#fff;font-size:10.5px;line-height:18px;text-align:center;font-weight:500}
.switch .c{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--ink-3)}

.nav-group{padding:0 10px;margin-bottom:22px}
.nav-head{padding:0 10px 6px;font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:5px 10px;border-radius:4px;color:var(--ink-2);
}
.nav-item:hover{background:#EDEDEB}
.nav-item[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.nav-item .c{font-size:11.5px;color:var(--ink-3)}
.nav-item .c{display:flex;align-items:center;gap:8px}
.nav-item .c b{font-weight:500;font-size:10px;line-height:15px;min-width:15px;height:15px;padding:0 4px;border-radius:2px;background:var(--ink);color:#fff;text-align:center}
.side-foot{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3);line-height:1.6}
.side-foot strong{display:block;font-weight:500;color:var(--ink-2)}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:18px 32px 14px}
.topbar h1{font-size:18px;font-weight:500;letter-spacing:.02em}
.topbar .when{font-size:12px;color:var(--ink-3)}
.filter-chip{
  display:inline-flex;align-items:center;gap:6px;margin-left:12px;vertical-align:2px;
  font-size:12px;font-weight:400;color:var(--ink-2);padding:1px 4px 1px 8px;border:1px solid var(--rule);border-radius:4px;
}
.filter-chip button{color:var(--ink-3);padding:0 4px;line-height:1.4}
.filter-chip button:hover{color:var(--ink)}

/* quota band */
.quota{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.q{display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;column-gap:16px;padding:12px 32px 11px}
.q + .q{border-left:1px solid var(--rule)}
.q-name{color:var(--ink-2)}
.q-bar{height:4px;background:var(--track);border-radius:2px;overflow:hidden}
.q-bar i{display:block;height:100%;background:var(--fill);transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
/* 推定値は破線で塗る：確定値と見分けるため */
.q-bar.est i{background:repeating-linear-gradient(90deg,var(--fill) 0 4px,transparent 4px 6px)}
.q-val{font-size:20px;font-weight:300;line-height:1;text-align:right;white-space:nowrap}
.q-val small{font-size:11.5px;font-weight:400;color:var(--ink-3);margin-left:3px}
.q-note{grid-column:2 / 4;font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.q-tag{display:inline-block;font-size:10.5px;line-height:1;padding:2px 4px;border:1px solid var(--rule);border-radius:3px;color:var(--ink-2);margin-right:6px;vertical-align:1px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.scroll{overflow-y:auto;flex:1;padding-bottom:48px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;padding:22px 32px 8px;font-size:12px;color:var(--ink-3)}
.group-head b{font-weight:500;color:var(--ink-2);margin-right:6px}

/* review cards: question on the left, decision on the right */
.reviews{padding:0 32px;display:flex;flex-direction:column;gap:10px}
.ask{
  display:grid;grid-template-columns:minmax(0,1fr) 216px;column-gap:28px;
  border:1px solid var(--ink);border-radius:6px;padding:14px 18px 16px;
  transition:opacity .25s, transform .25s;cursor:pointer;
}
.ask[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--primary)}
.ask.leaving{opacity:0;transform:translateX(24px)}
.ask-top{display:flex;align-items:center;gap:9px}
.badge{flex:none;font-size:10.5px;font-weight:500;line-height:1;padding:4px 6px;border-radius:3px;background:var(--ink);color:#fff;letter-spacing:.04em}
.badge.line{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ask-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .sep{display:inline-block;width:1px;height:9px;background:var(--rule);margin:0 8px;vertical-align:-1px}
.ask .meta{margin:2px 0 0}
.ask-q{margin:10px 0 2px;font-size:14px;line-height:1.7;max-width:60ch}
.ask-note{font-size:12.5px;color:var(--ink-3);max-width:64ch}
.ask-actions{display:flex;flex-wrap:wrap;align-content:space-between;gap:8px;border-left:1px solid var(--rule-soft);padding-left:20px}
.ask-actions .wait{flex-basis:100%;font-size:11.5px;color:var(--ink-3);text-align:right}
.ask-actions .btn{flex:1}
.btn{
  text-align:center;padding:7px 14px;border-radius:5px;border:1px solid var(--rule);
  background:var(--paper);color:var(--ink);font-weight:500;
}
.btn:hover{border-color:#CFCFCC;background:#FAFAF9}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}

/* session rows */
.cols{display:grid;grid-template-columns:14px minmax(0,1fr) 150px 140px 64px;column-gap:18px;align-items:center}
.list-head{padding:0 32px 6px;font-size:11px;color:var(--ink-3)}
.list-head span:last-child{text-align:right}
.row{width:100%;padding:12px 32px;border-top:1px solid var(--rule-soft)}
.group-head + .row{border-top-color:var(--rule)}
.row:hover{background:#FAFAF9}
.row[aria-selected="true"]{background:var(--primary-tint);box-shadow:inset 3px 0 0 var(--primary)}
.dot{width:8px;height:8px;border-radius:50%;justify-self:center;align-self:start;margin-top:7px}
.dot.run{background:var(--fill);animation:pulse 2.4s ease-in-out infinite}
.dot.done{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.dot.fail{border-radius:1px;width:9px;height:9px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink);position:relative}
.dot.fail::after{content:"";position:absolute;inset:3.5px 2px auto;height:2px;background:var(--ink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.r-main{min-width:0}
.r-title{display:flex;align-items:center;gap:8px;min-width:0}
.r-title span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-now{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-who{font-size:12px;color:var(--ink-2);line-height:1.5;min-width:0}
.r-who span{display:block;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-prog{display:flex;flex-direction:column;gap:5px}
.r-prog small{font-size:11px;color:var(--ink-3);line-height:1}
.bar{height:2px;background:var(--track);border-radius:1px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--fill)}
.r-min{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
/* 失敗：止まった地点に刻みを入れ、その先を破線で残す */
.row.is-fail .bar{background:repeating-linear-gradient(90deg,var(--rule) 0 3px,transparent 3px 6px);overflow:visible}
.row.is-fail .bar i{background:var(--ink);position:relative}
.row.is-fail .bar i::after{content:"";position:absolute;right:0;top:-3px;width:2px;height:8px;background:var(--ink)}
.row.is-fail .r-now{color:var(--ink)}
.row.is-done .r-title span:last-child{color:var(--ink-2)}
.row.is-done .bar i{background:#B9B9B6}
.empty{margin:0 32px;padding:14px 16px;border:1px dashed var(--rule);border-radius:6px;color:var(--ink-3);font-size:12.5px}

/* ---------- right panel ---------- */
.panel{border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.p-head{padding:20px 24px 16px;border-bottom:1px solid var(--rule)}
.p-state{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.p-state .dot{margin:0}
.p-head h2{font-size:15.5px;font-weight:500;line-height:1.55;margin-bottom:6px}
.p-head .meta{white-space:normal}
.p-prog{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.p-body{overflow-y:auto;flex:1}
.p-sec{padding:18px 24px 20px}
.p-sec + .p-sec{border-top:1px solid var(--rule)}
.p-sec h3{font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:14px;display:flex;justify-content:space-between}
.p-sec h3 span{font-weight:400;color:var(--ink-3)}

/* next action: the decision sits first, because it's what the panel exists for */
.next p{line-height:1.7}
.next .sub{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.next .acts{display:flex;gap:8px;margin-top:14px}
.next .acts .btn{flex:1}

/* timeline */
.log{list-style:none;position:relative}
.log li{display:grid;grid-template-columns:42px 16px minmax(0,1fr);column-gap:8px;position:relative;padding-bottom:14px}
.log li:not(:last-child)::after{content:"";position:absolute;left:57px;top:16px;bottom:-2px;width:1px;background:var(--rule)}
.log time{font-size:11.5px;color:var(--ink-3);padding-top:1px}
.log .node{width:7px;height:7px;border-radius:50%;justify-self:center;margin-top:7px;background:var(--paper);box-shadow:inset 0 0 0 1px #B9B9B6;position:relative;z-index:1}
.log .k-ask .node{border-radius:1px;background:var(--ink);box-shadow:none;width:8px;height:8px}
.log .k-fail .node{border-radius:1px;width:9px;height:9px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink)}
.log .k-now .node{background:var(--fill);box-shadow:none;animation:pulse 2.4s ease-in-out infinite}
.log .k-done .node{background:var(--ink-3);box-shadow:none}
.log .txt{font-size:13px;line-height:1.6;color:var(--ink-2)}
.log .k-ask .txt,.log .k-fail .txt,.log .k-now .txt{color:var(--ink);font-weight:500}
.log .txt code{font-family:var(--mono);font-size:11.5px;background:var(--field);padding:0 4px;border-radius:3px;font-weight:400}

/* ---------- reports ---------- */
.reports{display:grid;grid-template-columns:400px minmax(0,1fr);flex:1;min-height:0;border-top:1px solid var(--rule)}
.rep-col{border-right:1px solid var(--rule);overflow-y:auto;padding-bottom:40px}
.rep-col .lede{padding:14px 24px 0;font-size:12.5px;color:var(--ink-3)}
.rep-col .group-head{padding:18px 24px 8px}
.rep{display:block;width:100%;padding:13px 24px 14px;border-top:1px solid var(--rule-soft)}
.group-head + .rep{border-top-color:var(--rule)}
.rep:hover{background:#FAFAF9}
.rep[aria-selected="true"]{background:var(--primary-tint);box-shadow:inset 3px 0 0 var(--primary)}
.rep-title{font-weight:500;line-height:1.55;margin-bottom:3px}
.rep-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.diff{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.diff-bar{display:flex;gap:1px;width:56px;height:5px}
.diff-bar i{display:block;height:100%;border-radius:1px}
.diff-bar .a{background:var(--fill)}
.diff-bar .d{background:var(--paper);box-shadow:inset 0 0 0 1px #B9B9B6}
.rep-time{font-size:12px;color:var(--ink-3)}

.rd{overflow-y:auto;padding-bottom:56px}
.rd-head{padding:22px 40px 20px;border-bottom:1px solid var(--rule)}
.rd-head h2{font-size:20px;font-weight:500;line-height:1.5;margin:4px 0 16px;max-width:36em}
.rd-stats{display:grid;grid-template-columns:repeat(4,minmax(0,160px));border:1px solid var(--rule);border-radius:5px;width:max-content;max-width:100%}
.rd-stats div{padding:8px 14px}
.rd-stats div + div{border-left:1px solid var(--rule)}
.rd-stats dt{font-size:11px;color:var(--ink-3)}
.rd-stats dd{font-size:14px}
.rd-sec{padding:22px 40px 24px}
.rd-sec + .rd-sec{border-top:1px solid var(--rule)}
.rd-sec h3{font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:12px}
.did{list-style:none;max-width:44em}
.did li{position:relative;padding:3px 0 3px 16px;line-height:1.7}
.did li::before{content:"";position:absolute;left:0;top:14px;width:6px;height:1px;background:var(--ink-3)}

/* each pick: code on the left, the reason beside it */
.pick{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:28px}
.pick + .pick{margin-top:28px;padding-top:28px;border-top:1px solid var(--rule-soft)}
.pick-file{grid-column:1 / -1;display:flex;gap:12px;align-items:baseline;font-size:12px;margin-bottom:8px}
.pick-file b{font-weight:500;font-family:var(--mono);font-size:12px}
.pick-file span{color:var(--ink-3)}
.code{
  background:var(--field);border:1px solid var(--rule-soft);border-radius:5px;
  font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto;padding:10px 0;align-self:start;
}
.code div{padding:0 14px;white-space:pre;border-left:2px solid transparent}
.code .hl{background:var(--primary-tint);border-left-color:var(--primary)}
.code .c{color:var(--ink-3)}
.why{padding-left:14px;border-left:1px solid var(--ink);align-self:start}
.why strong{display:block;font-size:11.5px;font-weight:500;color:var(--ink-2);margin-bottom:2px}
.why p{line-height:1.8}

.toast{
  position:fixed;left:50%;bottom:28px;z-index:9;transform:translate(-50%,8px);white-space:nowrap;
  background:var(--ink);color:#fff;padding:8px 16px;border-radius:5px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 狭い画面でも崩れないための最低限 */
@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr) 320px}
  .cols{grid-template-columns:14px minmax(0,1fr) 110px 56px}
  .cols > .r-who,.list-head .h-who{display:none}
  .reports{grid-template-columns:320px minmax(0,1fr)}
  .pick{grid-template-columns:1fr}
  .why{margin-top:12px}
}
@media (max-width:860px){
  .app,.app.is-reports{display:block;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--rule)}
  .main,.panel,.scroll,.rep-col,.rd{overflow:visible}
  .panel{border-left:0;border-top:1px solid var(--rule)}
  .quota,.reports{grid-template-columns:1fr}
  .q + .q{border-left:0;border-top:1px solid var(--rule)}
  .q,.topbar,.group-head,.row,.list-head,.rd-head,.rd-sec{padding-left:16px;padding-right:16px}
  .reviews{padding:0 16px}
  .ask{grid-template-columns:1fr}
  .ask-actions{border-left:0;padding-left:0;flex-direction:row;margin-top:12px}
  .ask-actions .wait{display:none}
  .ask-actions .btn{flex:1}
  .rd-stats{grid-template-columns:repeat(2,1fr);width:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ========== サイドバー ========== -->
  <aside class="side" aria-label="ナビゲーション">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Taskwatch</div>

    <div class="switch" role="tablist" aria-label="表示の切り替え">
      <button role="tab" id="tab-sessions" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="5" cy="6.5" r="1.4"/><circle cx="5" cy="12" r="1.4"/><circle cx="5" cy="17.5" r="1.4"/><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h6"/></svg>
        セッション<span class="cnt num" id="tab-cnt"></span>
      </button>
      <button role="tab" id="tab-reports" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3.5h8.5L18.5 7.5V20.5H6z"/><path d="M14.5 3.5v4h4M9 12h6.5M9 15.5h6.5"/></svg>
        レポート<span class="c num" id="rep-cnt"></span>
      </button>
    </div>

    <nav class="nav-group" aria-label="エージェント別">
      <div class="nav-head"><span>エージェント</span><span id="nav-unit">件数</span></div>
      <div id="nav-agents"></div>
    </nav>

    <nav class="nav-group" aria-label="リポジトリ別">
      <div class="nav-head"><span>リポジトリ</span></div>
      <div id="nav-repos"></div>
    </nav>

    <div class="side-foot">
      <strong>開発チーム</strong>
      同時実行の上限 8 セッション<br>
      <span class="num">11月20日（金）14:32 更新</span>
    </div>
  </aside>

  <!-- ========== メイン ========== -->
  <main class="main">
    <header class="topbar">
      <h1 id="main-title">セッション</h1>
      <span class="when num" id="main-when">14:32 更新</span>
    </header>

    <!-- セッション表示 -->
    <div id="v-sessions" style="display:contents">
      <section class="quota" aria-label="エージェント別の残量">
        <div class="q">
          <span class="q-name">Devin</span>
          <div class="q-bar" role="meter" aria-valuemin="0" aria-valuemax="250" aria-valuenow="142" aria-label="Devin ACU残量"><i style="width:56.8%"></i></div>
          <span class="q-val num">142<small>/ 250 ACU</small></span>
          <span class="q-note">今月の残り。12月1日にリセット</span>
        </div>

    <article class="ask" data-id="${r.id}" aria-selected="${state.sel === r.id}" tabindex="0">
      <div>
        <div class="ask-top"><span class="badge">要確認</span><span class="ask-name">${esc(r.name)}</span></div>
        <div class="meta">${r.agent}${sep}${r.repo}${sep}<span class="num">${fmtMin(r.min)}経過</span></div>
        <p class="ask-q">${esc(r.q)}</p>
        <p class="ask-note">${esc(r.note)}</p>
      </div>
      <div class="ask-actions">
        <span class="wait num">${r.log[r.log.length-1][0]} から待機</span>
        <button class="btn" data-act="却下">却下</button>
        <button class="btn btn-primary" data-act="承認">承認</button>
      </div>
    </article>`).join("") : `<p class="empty">判断待ちのセッションはありません。</p>`;
  const list = (arr, st) => arr.length ? arr.map(s => rowHTML(s, st)).join("") : `<p class="empty">該当するセッションはありません。</p>`;
  $("#runs").innerHTML = list(rn, "run");
  $("#fails").innerHTML = list(fl, "fail");
  $("#dones").innerHTML = list(dn, "done");
  $("#rev-count").textContent = rv.length;
  $("#run-count").textContent = rn.length;
  $("#fail-count").textContent = fl.length;
  $("#done-count").textContent = dn.length;
}

/* ---------- 右パネル ---------- */
function renderPanel(){
  const s = allSessions().find(x => x.id === state.sel);
  const p = $("#panel");
  if (!s){ p.innerHTML = `<div class="p-sec"><p class="empty" style="margin:0">一覧からセッションを選ぶと、作業ログと次のアクションがここに出ます。</p></div>`; return; }
  const pct = Math.round(s.done / s.total * 100);
  let acts = "";
  if (s.st === "rev") acts = `<button class="btn" data-pact="却下">却下</button><button class="btn btn-primary" data-pact="承認">承認</button>`;
  else if (s.st === "run") acts = `<button class="btn" data-pact="停止">セッションを停止</button>`;
  else if (s.next.acts) acts = s.next.acts.map((a, i, arr) => `<button class="btn${i === arr.length-1 ? " btn-primary" : ""}" data-pact="${a}">${a}</button>`).join("");
  p.innerHTML = `
    <div class="p-head">
      <div class="p-state"><span class="dot ${s.st === "rev" ? "fail" : s.st}" aria-hidden="true" ${s.st === "rev" ? 'style="background:var(--ink);box-shadow:none"' : ""}></span>${s.st === "fail" ? s.kind : STATE_LABEL[s.st]}</div>
      <h2>${esc(s.name)}</h2>
      <div class="meta">${s.agent}${sep}${s.repo}${sep}<span class="num">${fmtMin(s.min)}${s.st === "done" ? "で完了" : "経過"}</span></div>
      ${s.st === "done" ? "" : `<div class="p-prog"><span class="bar"><i style="width:${pct}%"></i></span><span class="num">${s.done} / ${s.total}</span></div>`}
    </div>
    <div class="p-body">
      <section class="p-sec next">
        <h3>次のアクション</h3>
        ${s.st === "rev" ? `<p>${esc(s.q)}</p>` : ""}
        <p${s.st === "rev" ? ' class="sub"' : ""}>${esc(s.next.p)}</p>
        ${s.next.sub ? `<p class="sub">${esc(s.next.sub)}</p>` : ""}
        ${acts ? `<div class="acts">${acts}</div>` : ""}
      </section>
      <section class="p-sec">
        <h3>作業ログ<span class="num">${s.log.length} 件</span></h3>
        <ol class="log">${s.log.map(([t, txt, k]) => `
          <li class="${k ? "k-" + k : ""}"><time class="num">${t}</time><span class="node" aria-hidden="true"></span><span class="txt">${txt}</span></li>`).join("")}
        </ol>
      </section>
    </div>`;
}

/* ---------- レポート ---------- */
function renderReports(){
  const items = reports.filter(match);
  let html = "", day = "";
  for (const r of items){
    if (r.day !== day){ day = r.day; html += `<div class="group-head"><span><b>${day}</b></span><span class="num">${items.filter(x => x.day === day).length} 件</span></div>`; }
    const tot = r.add + r.del;
    html += `
      <button class="rep" data-id="${r.id}" aria-selected="${state.rep === r.id}">
        <p class="rep-title">${esc(r.title)}</p>
        <div class="meta">${r.repo} <span class="num">#${r.pr}</span>${sep}${r.agent}</div>
        <div class="rep-foot">
          <span class="diff num" aria-label="追加${r.add}行、削除${r.del}行、${r.files}ファイル">
            <span class="diff-bar" aria-hidden="true"><i class="a" style="width:${r.add/tot*100}%"></i><i class="d" style="width:${r.del/tot*100}%"></i></span>
            +${r.add} −${r.del}${sep}${r.files}ファイル
          </span>
          <span class="rep-time num">${r.time} 完了</span>
        </div>
      </button>`;
  }
  $("#rep-list").innerHTML = html || `<p class="empty" style="margin:16px 24px">該当するレポートはありません。</p>`;
  if (!items.find(x => x.id === state.rep)) state.rep = items[0] && items[0].id;
  renderDetail(reports.find(x => x.id === state.rep));
}

function renderDetail(r){
  const d = $("#rep-detail");
  if (!r){ d.innerHTML = ""; return; }
  d.innerHTML = `
    <header class="rd-head">
      <div class="meta">${r.repo} <span class="num">#${r.pr}</span>${sep}${r.agent}${sep}<span class="num">${r.day} ${r.time} 完了</span></div>
      <h2>${esc(r.title)}</h2>
      <dl class="rd-stats">
        <div><dt>変更行数</dt><dd class="num">+${r.add} −${r.del}</dd></div>
        <div><dt>ファイル</dt><dd class="num">${r.files}</dd></div>
        <div><dt>所要時間</dt><dd class="num">${r.took}</dd></div>
        <div><dt>プルリクエスト</dt><dd class="num">#${r.pr}</dd></div>
      </dl>
    </header>
    <section class="rd-sec">
      <h3>やったこと</h3>
      <ul class="did">${r.did.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    </section>
    <section class="rd-sec">
      <h3>重要なコード</h3>
      ${r.picks.map(p => `
        <div class="pick">
          <div class="pick-file"><b>${esc(p.file)}</b><span class="num">${p.lines}</span></div>
          <div class="code" tabindex="0" aria-label="${esc(p.file)} のコード">${p.code.map(([t,c]) => `<div${c ? ` class="${c}"` : ""}>${esc(t) || " "}</div>`).join("")}</div>
          <div class="why"><strong>こう書いた理由</strong><p>${esc(p.why)}</p></div>
        </div>`).join("")}
    </section>`;
  d.scrollTop = 0;
}

/* ---------- 全体 ---------- */
function render(){
  const rep = state.view === "reports";
  $("#app").classList.toggle("is-reports", rep);
  $("#v-sessions").hidden = rep;
  $("#v-reports").hidden = !rep;
  $("#tab-sessions").setAttribute("aria-selected", !rep);
  $("#tab-reports").setAttribute("aria-selected", rep);
  const f = state.filter;
  $("#main-title").innerHTML = (rep ? "レポート" : "セッション") +
    (f ? `<span class="filter-chip">${esc(f.v)}<button id="clear-filter" aria-label="絞り込みを解除">×</button></span>` : "");
  renderNav();
  if (rep) renderReports(); else { renderSessions(); renderPanel(); }
}

/* ---------- 操作 ---------- */
let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

function decide(id, act, card){
  const r = reviews.find(x => x.id === id); if (!r) return;
  const finish = () => {
    reviews.splice(reviews.indexOf(r), 1);
    if (act === "承認") runs.unshift({...r, done:r.done+1, now:"承認を受けて再開",
      next:{p:"承認を受けて作業を再開しました。", sub:"終わるとプルリクエストを作成し、レポートに追加されます。"},
      log:[...r.log, ["14:33","承認を受けて再開","now"]]});
    else state.sel = reviews[0] ? reviews[0].id : (runs[0] && runs[0].id);
    render();
  };
  if (card){ card.classList.add("leaving"); setTimeout(finish, 250); } else finish();
  toast(`「${r.name}」を${act}しました`);
}

$("#reviews").addEventListener("click", e => {
  const card = e.target.closest(".ask"); if (!card) return;
  const b = e.target.closest("[data-act]");
  if (b){ decide(card.dataset.id, b.dataset.act, card); return; }
  state.sel = card.dataset.id; render();
});
$("#reviews").addEventListener("keydown", e => {
  const card = e.target.closest(".ask");
  if (card && e.target === card && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); state.sel = card.dataset.id; render(); }
});
$("#s-scroll").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  state.sel = row.dataset.id; render();
});
$("#panel").addEventListener("click", e => {
  const b = e.target.closest("[data-pact]"); if (!b) return;
  const a = b.dataset.pact, s = allSessions().find(x => x.id === state.sel);
  if (a === "承認" || a === "却下"){ decide(s.id, a, document.querySelector(`.ask[data-id="${s.id}"]`)); return; }
  if (a === "レポートを見る"){ state.view = "reports"; state.rep = s.report; render(); return; }
  toast(`「${s.name}」：${a}（モックのため実行されません）`);
});
$("#rep-list").addEventListener("click", e => {
  const b = e.target.closest(".rep"); if (!b) return;
  state.rep = b.dataset.id;
  document.querySelectorAll(".rep").forEach(x => x.setAttribute("aria-selected", x === b));
  renderDetail(reports.find(x => x.id === state.rep));
});
document.querySelector(".side").addEventListener("click", e => {
  const n = e.target.closest(".nav-item"); if (!n) return;
  const {k, v} = n.dataset;
  state.filter = state.filter && state.filter.k === k && state.filter.v === v ? null : {k, v};
  render();
});
$("#main-title").addEventListener("click", e => { if (e.target.id === "clear-filter"){ state.filter = null; render(); } });
$("#tab-sessions").addEventListener("click", () => { state.view = "sessions"; render(); });
$("#tab-reports").addEventListener("click", () => { state.view = "reports"; render(); });

render();
</script>
</body>
</html>
